[pytest]
pythonpath = .
testpaths = tests

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

addopts = 
    --cov=apps
    --cov=server
    --cov=utils
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=85

[coverage:run]
omit =
    apps/bots/telegram/gateway.py
    apps/bots/telegram/normalizer.py
    apps/bots/telegram/renderer.py
    apps/bots/common/media_flow.py
    apps/bots/common/urls.py
    apps/bots/common/settings.py
    apps/bots/common/onboarding.py
    apps/bots/runtime/handlers.py
    apps/bots/runtime/poller.py
    apps/ai/task_poller.py
    apps/bots/common/callbacks/chat.py
    apps/bots/common/callbacks/convert.py
    apps/bots/bale/renderer.py
